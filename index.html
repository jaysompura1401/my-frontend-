/* ── Barcode modal (screen view) ── */
.barcode-modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.55);display:flex;align-items:center;justify-content:center;z-index:9999}
.barcode-modal{background:#fff;border-radius:12px;min-width:300px;max-width:92vw;box-shadow:0 10px 40px rgba(0,0,0,.3);overflow:hidden;font-family:'Plus Jakarta Sans',Roboto,sans-serif}
.barcode-modal-header{display:flex;align-items:center;justify-content:space-between;padding:12px 18px;background:#1e293b;color:#fff;font-weight:700;font-size:14px}
.barcode-modal-header-actions{display:flex;align-items:center;gap:8px}
.barcode-modal-close{background:none;border:none;color:#fff;font-size:20px;line-height:1;cursor:pointer;padding:0 4px}
.barcode-print-btn{background:#ff6b00;border:none;color:#fff;font-size:12px;font-weight:700;padding:5px 14px;border-radius:6px;cursor:pointer;font-family:inherit}
.barcode-print-btn:hover{background:#e65c00}
/* Body: tight padding — label sits flush */
.barcode-modal-body{padding:10px 14px 12px;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:0;min-width:260px;background:#fff}
.barcode-svg{display:block;width:100%;height:auto}
.barcode-label-name{font-size:13px;font-weight:700;color:#111;text-align:center;margin-top:2px;line-height:1.3;max-width:220px}
.barcode-label-price{font-size:13px;font-weight:700;color:#333;text-align:center;margin-top:1px}
.barcode-empty{color:#6b7280;font-size:14px;text-align:center;margin:0;padding:16px 0}
/* Label size options row */
.barcode-label-options{display:flex;align-items:center;gap:8px;padding:8px 14px;background:#f8fafc;border-bottom:1px solid #e5e7eb;flex-wrap:wrap;}
.blo-label{font-size:11px;font-weight:700;color:#6b7280;white-space:nowrap;}
.blo-select{font-size:12px;font-weight:600;border:1.5px solid #d1d5db;border-radius:6px;padding:4px 8px;background:#fff;color:#1f2937;font-family:inherit;outline:none;cursor:pointer;}
.blo-select:focus{border-color:#ff6b00;}
.blo-tip{font-size:10px;color:#9ca3af;font-weight:500;}

/* ── Print styles: ONLY the label content prints, nothing else ── */
@media print {
  /* Hide absolutely everything */
  body > *                { display:none !important; }
  /* Show only the print-label element */
  #barcode-print-root     { display:block !important; }

  @page {
    size: 50mm 25mm;          /* standard thermal label size */
    margin: 0;                /* zero page margin — content fills sticker */
  }

  #barcode-print-root {
    position:fixed;
    inset:0;
    display:flex !important;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    padding:0;
    margin:0;
    background:#fff;
    width:50mm;
    height:25mm;
    overflow:hidden;
  }
  #barcode-print-root svg {
    display:block;
    width:48mm !important;
    height:auto !important;
    max-height:16mm;
  }
  #barcode-print-root .bl-name {
    font-size:7pt;
    font-weight:700;
    text-align:center;
    color:#000;
    margin:0;
    line-height:1.2;
    max-width:48mm;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
  }
  #barcode-print-root .bl-price {
    font-size:7pt;
    font-weight:700;
    text-align:center;
    color:#000;
    margin:0;
    line-height:1.2;
  }
}
</style>
<script src="https://cdn.jsdelivr.net/npm/jsbarcode@3.11.6/dist/JsBarcode.all.min.js?v=1785587262148"></script>
<script>
window.__BARCODE_API_BASE = 'https://my-backend-production-4e0a.up.railway.app/api';

window.__renderBarcodeSvg = function (bodyEl, code, product) {
  bodyEl.innerHTML = '<svg class="barcode-svg"></svg>';
  try {
    window.JsBarcode(bodyEl.querySelector('.barcode-svg'), String(code), {
      format: 'EAN13',
      displayValue: true,
      lineColor: '#000000',
      width: 2.2,
      height: 60,
      margin: 0,          /* zero margin — no white space around bars */
      marginTop: 2,
      marginBottom: 2,
      marginLeft: 4,
      marginRight: 4,
      fontSize: 12,
      textMargin: 2,
      background: '#ffffff'
    });
  } catch (err) {
    bodyEl.innerHTML =
      '<p class="barcode-empty">Could not render barcode value: ' + code + '</p>';
    return;
  }
  /* Add product name and price below barcode */
  if (product) {
    if (product.name) {
      var nameEl = document.createElement('div');
      nameEl.className = 'barcode-label-name';
      nameEl.textContent = product.name;
      bodyEl.appendChild(nameEl);
    }
    if (product.price !== undefined && product.price !== null) {
      var priceEl = document.createElement('div');
      priceEl.className = 'barcode-label-price';
      priceEl.textContent = 'Rs. ' + (Number(product.price)||0).toFixed(2);
      bodyEl.appendChild(priceEl);
    }
  }
};

window.__generateBarcode = function (product) {
  /* ── Remove any stale print root ── */
  var old = document.getElementById('barcode-print-root');
  if (old) old.parentNode.removeChild(old);

  var overlay = document.createElement('div');
  overlay.className = 'barcode-modal-overlay';
  overlay.innerHTML =
    '<div class="barcode-modal">' +
      '<div class="barcode-modal-header">' +
        '<span>' + (product && product.name ? product.name : 'Product') + '</span>' +
        '<div class="barcode-modal-header-actions">' +
          '<button class="barcode-print-btn" id="barcode-do-print">&#128424; Print Label</button>' +
          '<button class="barcode-modal-close" aria-label="Close">&times;</button>' +
        '</div>' +
      '</div>' +
      /* Label size selector + print tip */
      '<div class="barcode-label-options">' +
        '<label class="blo-label">Label Size:</label>' +
        '<select id="barcod-size-sel" class="blo-select">' +
          '<option value="50x25">50mm &times; 25mm (default)</option>' +
          '<option value="40x30">40mm &times; 30mm</option>' +
          '<option value="58x30">58mm &times; 30mm (receipt roll)</option>' +
          '<option value="60x40">60mm &times; 40mm</option>' +
        '</select>' +
        '<span class="blo-tip">&#9432; Set your printer paper size to match</span>' +
      '</div>' +
      '<div class="barcode-modal-body"><p class="barcode-empty">Generating barcode\u2026</p></div>' +
    '</div>';
  document.body.appendChild(overlay);

  function close() {
    document.body.removeChild(overlay);
    document.removeEventListener('keydown', onKey);
    var pr = document.getElementById('barcode-print-root');
    if (pr) pr.parentNode.removeChild(pr);
  }
  function onKey(e) { if (e.key === 'Escape') close(); }
  overlay.addEventListener('click', function (e) { if (e.target === overlay) close(); });
  overlay.querySelector('.barcode-modal-close').addEventListener('click', close);
  document.addEventListener('keydown', onKey);

  var body = overlay.querySelector('.barcode-modal-body');

  /* ── Print button handler ── */
  overlay.querySelector('#barcode-do-print').addEventListener('click', function () {
    var svgEl = body.querySelector('svg');
    if (!svgEl) { alert('Barcode not ready yet. Please wait.'); return; }

    /* Read selected label size */
    var sizeVal  = overlay.querySelector('#barcod-size-sel').value;   /* e.g. "50x25" */
    var parts    = sizeVal.split('x');
    var labelW   = parts[0] + 'mm';   /* e.g. "50mm" */
    var labelH   = parts[1] + 'mm';   /* e.g. "25mm" */
    var innerW   = (parseInt(parts[0]) - 2) + 'mm';  /* 1mm padding each side */
    var maxBarH  = Math.max(10, Math.round(parseInt(parts[1]) * 0.58)) + 'mm';

    /* Serialize SVG */
    var svgHtml = new XMLSerializer().serializeToString(svgEl);
    var productName  = (product && product.name)  ? product.name  : '';
    var productPrice = (product && product.price !== undefined && product.price !== null)
                       ? 'Rs. ' + (Number(product.price)||0).toFixed(2) : '';

    /* Self-contained label page */
    var labelHtml =
      '<!DOCTYPE html><html><head><meta charset="UTF-8"><title>Label</title>' +
      '<style>' +
        'html,body{margin:0;padding:0;background:#fff;width:' + labelW + ';height:' + labelH + ';overflow:hidden;}' +
        '@page{size:' + labelW + ' ' + labelH + ';margin:0;}' +
        '.lw{width:' + labelW + ';height:' + labelH + ';display:flex;flex-direction:column;' +
          'align-items:center;justify-content:center;padding:0 1mm;box-sizing:border-box;}' +
        'svg{display:block;width:' + innerW + '!important;height:auto!important;max-height:' + maxBarH + ';}' +
        '.ln{font-family:Arial,sans-serif;font-size:6.5pt;font-weight:700;text-align:center;' +
          'color:#000;width:' + innerW + ';white-space:nowrap;overflow:hidden;text-overflow:ellipsis;' +
          'line-height:1.2;margin:0;}' +
        '.lp{font-family:Arial,sans-serif;font-size:6.5pt;font-weight:700;text-align:center;' +
          'color:#000;line-height:1.2;margin:0;}' +
      '</style></head><body>' +
      '<div class="lw">' +
        svgHtml +
        (productName  ? '<div class="ln">'  + productName.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;') + '</div>' : '') +
        (productPrice ? '<div class="lp">'  + productPrice + '</div>' : '') +
      '</div>' +
      '<scr' + 'ipt>window.onload=function(){' +
        'window.focus();' +
        'setTimeout(function(){window.print();},120);' +
        'window.onafterprint=function(){window.close();};' +
      '};</scr' + 'ipt>' +
      '</body></html>';

    /* Open popup */
    var popup = window.open('', '_blank',
      'width=240,height=180,menubar=no,toolbar=no,location=no,status=no,scrollbars=no,resizable=no');
    if (!popup) {
      /* Popup blocked fallback — inject into page and use window.print() */
      var pr = document.getElementById('barcode-print-root');
      if (pr) pr.parentNode.removeChild(pr);
      pr = document.createElement('div');
      pr.id = 'barcode-print-root';
      pr.style.display = 'none';
      pr.appendChild(svgEl.cloneNode(true));
      if (productName) { var n=document.createElement('div'); n.className='bl-name'; n.textContent=productName; pr.appendChild(n); }
      if (productPrice){ var p2=document.createElement('div'); p2.className='bl-price'; p2.textContent=productPrice; pr.appendChild(p2); }
      document.body.appendChild(pr);
      window.print();
      return;
    }
    popup.document.open();
    popup.document.write(labelHtml);
    popup.document.close();
  });

  /* ── Render barcode ── */
  if (product && product.barcode) {
    window.__renderBarcodeSvg(body, product.barcode, product);
    return;
  }

  if (!product || !product.id) {
    body.innerHTML = '<p class="barcode-empty">This product has no ID to generate a barcode for.</p>';
    return;
  }

  var token = null;
  try { token = localStorage.getItem('token'); } catch (e) {}

  fetch(window.__BARCODE_API_BASE + '/products/' + product.id + '/barcode', {
    method: 'POST',
    headers: Object.assign(
      { 'Content-Type': 'application/json' },
      token ? { Authorization: 'Bearer ' + token } : {}
    )
  })
    .then(function (res) {
      if (!res.ok) throw new Error('Request failed with status ' + res.status);
      return res.json();
    })
    .then(function (data) {
      if (!data || !data.barcode) throw new Error('No barcode returned');
      product.barcode = data.barcode;
      window.__renderBarcodeSvg(body, data.barcode, product);
    })
    .catch(function (err) {
      body.innerHTML = '<p class="barcode-empty">Could not generate a barcode. Please try again.</p>';
    });
};
</script>
<script>
// ── Inject "Bulk Stock" tab into nav ──
(function() {
  var BULK_URL = '/bulk-stock';
  var injected = false;

  function getUserRole() {
    try { return JSON.parse(localStorage.getItem('user') || '{}').role || ''; } catch(e) { return ''; }
  }

  // For admin: hide all non-Donation nav items immediately after Angular renders them.
  function applyAdminNavRestrictions() {
    if (getUserRole() !== 'admin') return;
    var navWrapper = document.querySelector('.nav-wrapper');
    if (navWrapper) {
      navWrapper.querySelectorAll('.nav-item').forEach(function(item) {
        if (item.id !== 'nav-donation-btn' && !item.classList.contains('awd-nav-tab')) {
          item.style.display = 'none';
        }
      });
    }
    var mobileNav = document.querySelector('.mobile-bottom-nav');
    if (mobileNav) {
      mobileNav.querySelectorAll('.mob-tab').forEach(function(tab) {
        if (tab.id !== 'mob-donation-btn' && !tab.classList.contains('awd-mob-tab')) {
          tab.style.display = 'none';
        }
      });
    }
  }

  function copyNgAttributes(sourceEl, targetEl) {
    if (!sourceEl || !targetEl) return;
    for (var i = 0; i < sourceEl.attributes.length; i++) {
      var attr = sourceEl.attributes[i];
      if (attr.name.startsWith('_ngcontent')) {
        targetEl.setAttribute(attr.name, attr.value);
        // Also apply to children of target
        var children = targetEl.querySelectorAll('*');
        for (var j = 0; j < children.length; j++) {
          children[j].setAttribute(attr.name, attr.value);
        }
        break;
      }
    }
  }

  function inject() {
    if (injected) return;
    // Admin is Donation-only — skip Bulk Stock tab injection entirely.
    if (getUserRole() === 'admin') { injected = true; return; }
    
    var desktopInjected = false;
    var mobileInjected = false;

    // Desktop nav
    var navWrapper = document.querySelector('.nav-wrapper');
    if (navWrapper && !navWrapper.querySelector('.bulk-stock-tab')) {
      var sibling = navWrapper.querySelector('.nav-item');
      if (sibling) {
        var a = document.createElement('a');
        a.href = BULK_URL;
        a.className = 'nav-item bulk-stock-tab';
        // Add exact same inner HTML structure
        a.innerHTML = '<mat-icon class="mat-icon material-icons" role="img" aria-hidden="true">inventory</mat-icon><span>Bulk Stock</span>';
        
        copyNgAttributes(sibling, a);
        navWrapper.appendChild(a);
        desktopInjected = true;
      }
    } else if (navWrapper) {
      desktopInjected = true;
    }

    // Also inject Accounting tab (after Bulk Stock)
    if (navWrapper && !navWrapper.querySelector('.accounting-tab')) {
      var existingBulk = navWrapper.querySelector('.bulk-stock-tab');
      var siblingForAcc = existingBulk || navWrapper.querySelector('.nav-item');
      if (siblingForAcc) {
        var acc = document.createElement('a');
        acc.href = '/accounting';
        acc.className = 'nav-item accounting-tab';
        acc.innerHTML = '<mat-icon class="mat-icon material-icons" role="img" aria-hidden="true">calculate</mat-icon><span>Accounting</span>';
        copyNgAttributes(siblingForAcc, acc);
        navWrapper.appendChild(acc);
      }
    }

    // Mobile nav
    var mobileNav = document.querySelector('.mobile-bottom-nav');
    if (mobileNav && !mobileNav.querySelector('.bulk-stock-mob')) {
      var invoiceTabs = mobileNav.querySelectorAll('.mob-tab');
      if (invoiceTabs.length > 0) {
        var sibling = invoiceTabs[0];
        var m = document.createElement('a');
        m.href = BULK_URL;
        m.className = 'mob-tab bulk-stock-mob';
        m.innerHTML = '<mat-icon class="mat-icon material-icons" role="img" aria-hidden="true">inventory</mat-icon><span>Bulk</span>';
        
        copyNgAttributes(sibling, m);
        
        var lastTab = invoiceTabs[invoiceTabs.length - 1];
        lastTab.parentNode.insertBefore(m, lastTab);
        mobileInjected = true;
      }
    } else if (mobileNav) {
      mobileInjected = true;
    }

    // Inject Accounting tab into mobile nav (after Bulk Stock)
    if (mobileNav && !mobileNav.querySelector('.accounting-mob')) {
      var mobTabs2 = mobileNav.querySelectorAll('.mob-tab');
      if (mobTabs2.length > 0) {
        var mobSib2 = mobTabs2[0];
        var accMob = document.createElement('a');
        accMob.href = '/accounting';
        accMob.className = 'mob-tab accounting-mob';
        accMob.innerHTML = '<mat-icon class="mat-icon material-icons" role="img" aria-hidden="true">calculate</mat-icon><span>Accounting</span>';
        copyNgAttributes(mobSib2, accMob);
        var lastMobTab = mobileNav.querySelector('.mob-tab:last-child');
        if (lastMobTab) lastMobTab.parentNode.appendChild(accMob);
      }
    }

    if (desktopInjected && mobileInjected) {
      injected = true;
    } else if (desktopInjected && !document.querySelector('.mobile-bottom-nav')) {
      // Sometimes mobile nav is not in DOM for desktop view
      injected = true; 
    }
  }

  // observe DOM until Angular renders the header
  var obs = new MutationObserver(function() { inject(); applyAdminNavRestrictions(); });
  obs.observe(document.body, { childList: true, subtree: true });
  
  // also try immediately & after short delay
  inject();
  applyAdminNavRestrictions();
  setTimeout(function() { inject(); applyAdminNavRestrictions(); }, 1500);
  setTimeout(function() { inject(); applyAdminNavRestrictions(); }, 3000);
})();
</script>
